<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173e36">
  <meta name="robots" content="noindex">
  <title>FGSM3 · Day 3 · Individual activity</title>
  <style>
    html,body{height:100%;margin:0;font-family:Arial,sans-serif;background:#f3f7f5;color:#173e36}.loader{min-height:100%;display:grid;place-items:center;padding:24px}.card{max-width:680px;padding:28px;border-radius:24px;background:#fff;box-shadow:0 18px 50px rgba(23,62,54,.16);text-align:center}.spinner{width:44px;height:44px;border:5px solid #dbe9e3;border-top-color:#24695a;border-radius:50%;margin:0 auto 18px;animation:spin .8s linear infinite}.card h1{margin:.2em 0}.card p{line-height:1.55}.retry{display:none;margin:18px auto 0;padding:12px 16px;border:0;border-radius:12px;background:#173e36;color:#fff;font-weight:800;cursor:pointer}.back{display:inline-block;margin-top:14px;color:#24695a;font-weight:700}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.spinner{animation:none}}
  </style>
</head>
<body>
  <div class="loader"><div class="card" role="status" aria-live="polite"><div class="spinner" aria-hidden="true"></div><h1>Opening the individual mission…</h1><p id="loadText">Loading the audited Day 3 Humanitarian Field Mission.</p><button class="retry" id="retry" type="button">Try again</button><br><a class="back" href="fgsm3-day3.html">← Change activity</a></div></div>
  <script>
  (()=>{
    'use strict';
    const SNAPSHOT='d903561';
    const urls=[
      `https://raw.githubusercontent.com/lecomteeglantine/MedicalEnglishForMrsLecomteStudents/${SNAPSHOT}/fgsm3-day3.html`,
      `https://github.com/lecomteeglantine/MedicalEnglishForMrsLecomteStudents/raw/${SNAPSHOT}/fgsm3-day3.html`
    ];
    const text=document.getElementById('loadText');
    const retry=document.getElementById('retry');
    const CACHE_KEY='fgsm3-day3-individual-snapshot-d903561';
    async function fetchText(url){const r=await fetch(url,{cache:'force-cache'});if(!r.ok)throw new Error('HTTP '+r.status);return r.text()}
    function prepare(html){
      html=html.replace(/<link rel="canonical"[^>]*>/i,'<link rel="canonical" href="https://lecomteeglantine.github.io/MedicalEnglishForMrsLecomteStudents/fgsm3-day3-individual.html">');
      html=html.replace(/<title>[^<]*<\/title>/i,'<title>FGSM3 · Day 3 · Individual Activity · Humanitarian Field Mission</title>');
      const banner='<div style="position:sticky;top:0;z-index:9999;background:#102f29;color:white;padding:10px 16px;text-align:center;font:800 14px/1.3 Arial,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.18)"><span style="margin-right:12px">👤 Individual activity · Work alone</span><a href="fgsm3-day3.html" style="color:#d9fff2;text-decoration:underline">← Change activity</a></div>';
      return html.replace(/(<body[^>]*>)/i,'$1'+banner);
    }
    async function load(){
      retry.style.display='none'; text.textContent='Loading the audited Day 3 Humanitarian Field Mission.';
      let lastError;
      for(const url of urls){try{const html=await fetchText(url);try{localStorage.setItem(CACHE_KEY,html)}catch(_){}document.open();document.write(prepare(html));document.close();return}catch(e){lastError=e}}
      try{const cached=localStorage.getItem(CACHE_KEY);if(cached){document.open();document.write(prepare(cached));document.close();return}}catch(_){}
      console.error(lastError);text.textContent='The individual mission could not be loaded. Check your internet connection, then try again.';retry.style.display='inline-block';
    }
    retry.addEventListener('click',load);load();
  })();
  </script>
</body>
</html>
